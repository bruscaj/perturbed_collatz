name: Verify research release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  external-support:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install sandbox and pinned supporting toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y elan bubblewrap
          elan toolchain install leanprover/lean4:v4.35.0
      - name: Exact finite external-model certificates
        run: python3 certificates/external_problems/verify.py
      - name: Supporting clean build, axioms, fresh replay and independent comparison
        run: python3 lean/external_problems/verify.py --mode full --report /tmp/external-support.json
      - name: Supporting hostile fixtures
        run: python3 lean/external_problems/test_mutations.py --mode full
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install manuscript tools
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended
      - name: Install elan and pinned Lean toolchains
        run: |
          sudo apt-get install -y elan
          elan toolchain install leanprover/lean4:v4.19.0
          elan toolchain install leanprover/lean4:v4.24.0
      - name: Check every certificate, Lean project, and manuscript
        run: python3 scripts/verify.py --mode all --report /tmp/verification.json
