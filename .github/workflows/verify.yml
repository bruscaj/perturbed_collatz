name: Verify research release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Preserve running evidence jobs when a reviewed checkpoint is pushed.
  cancel-in-progress: false
jobs:
  external-support:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install sandbox and pinned supporting toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst --output "${RUNNER_TEMP}/lean.tar.zst"
          printf '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  %s\n' "${RUNNER_TEMP}/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "${RUNNER_TEMP}/lean.tar.zst" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Exact finite external-model certificates
        run: |
          git rev-parse HEAD HEAD^{tree} > /tmp/external-source-tree.txt
          python3 certificates/external_problems/verify.py > /tmp/external-finite.json
      - name: Supporting clean build, axioms, fresh replay and independent comparison
        run: python3 lean/external_problems/verify.py --mode full --report /tmp/external-support.json
      - name: Supporting hostile fixtures
        run: python3 lean/external_problems/test_mutations.py --mode full --report /tmp/external-mutations.json
      - name: Preserve supporting receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-support-${{ github.sha }}
          path: |
            /tmp/external-source-tree.txt
            /tmp/external-finite.json
            /tmp/external-support.json
            /tmp/external-mutations.json
  external-analysis-h1:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      MATHLIB_NO_CACHE_ON_UPDATE: '1'
      MATHLIB_CACHE_DIR: /tmp/external-analysis-mathlib-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install sandbox and pinned supporting toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap zstd
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst --output "${RUNNER_TEMP}/lean.tar.zst"
          printf '7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d  %s\n' "${RUNNER_TEMP}/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "${RUNNER_TEMP}/lean.tar.zst" -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Fetch locked public analysis dependencies
        working-directory: lean/external_analysis
        run: |
          lake resolve-deps
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          subprocess.run(['lake', 'exe', 'cache', 'get', *Path('cache-imports.txt').read_text().split()], check=True)
          PYTHON
      - name: Depth-one clean build, complete closure replay and frozen comparison
        run: |
          git rev-parse HEAD HEAD^{tree} > /tmp/external-analysis-source-tree.txt
          python3 lean/external_analysis/verify.py --mode full --report /tmp/external-analysis.json
      - name: Depth-one hostile fixtures
        run: python3 lean/external_analysis/test_mutations.py --mode full --report /tmp/external-analysis-mutations.json
      - name: Preserve depth-one receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-analysis-h1-${{ github.sha }}
          path: |
            /tmp/external-analysis-source-tree.txt
            /tmp/external-analysis.json
            /tmp/external-analysis-mutations.json
            /tmp/external-analysis-mutations-logs/
