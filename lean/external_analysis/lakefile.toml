name = "external_analysis"
version = "0.1.0"
defaultTargets = ["Solution"]
# Preserve the exact pre-module-system frozen source bytes.
allowNonModules = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "Definitions"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "ExpectedTypes"
